# Example host Nginx vhost for DNS Guard at abs.whao.tech.
#
# This is the "single host" layout — JSON API and DoH proxy share one cert/server block.
# Path layout:
#   https://abs.whao.tech/v1/*          → JSON API
#   https://abs.whao.tech/dns-query/<t> → DoH proxy
#
# Place under /etc/nginx/sites-available/dns-guard.conf, symlink to sites-enabled,
# then `nginx -t && systemctl reload nginx`.
#
# Prereqs:
#   - Let's Encrypt cert for abs.whao.tech
#   - `BACKEND/` stack running with backend bound to 127.0.0.1:8080
#   - AdGuard UI bound to 127.0.0.1:3000 — DO NOT add a vhost for it.

# Rate-limit zones (put these at http {} level if not already there):
# limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=dns_zone:10m rate=100r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abs.whao.tech;

    ssl_certificate     /etc/letsencrypt/live/abs.whao.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abs.whao.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- JSON API ---
    location /v1/ {
        limit_req zone=api_zone burst=40 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- DoH (high QPS, body streamed) ---
    location /dns-query/ {
        limit_req zone=dns_zone burst=200 nodelay;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 10s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    location / {
        return 404;
    }
}

# Optional: redirect plain HTTP to HTTPS (and answer Let's Encrypt challenges).
server {
    listen 80;
    listen [::]:80;
    server_name abs.whao.tech;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# --- AdGuard control UI: intentionally NOT exposed publicly. ---
# To reach it: ssh -L 3000:localhost:3000 you@vps  →  http://localhost:3000
